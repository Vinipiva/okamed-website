[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "http://okamed.com.br/*"
  to = "https://okamed.com.br/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.okamed.com.br/*"
  to = "https://okamed.com.br/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
